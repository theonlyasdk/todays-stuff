body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}

.fab{position:fixed;z-index:5;right:max(16px,calc((100vw - 720px)/2 + 16px));bottom:calc(16px + env(safe-area-inset-bottom,0px));min-height:56px;padding:0 20px;font-size:16px;box-shadow:0 4px 12px rgba(0,0,0,.2)}

ul{list-style:none;margin:0;padding:0}
#items{display:block}
.row{display:flex;align-items:center;gap:12px;padding:4px 4px 4px 16px;min-height:56px;border-bottom:1px solid var(--line);transition:background .15s ease-out}

.icon{flex:none;width:40px;height:40px;display:grid;place-items:center;border:0;background:none;color:var(--muted);border-radius:var(--r-sm);cursor:pointer;transition:color .15s ease-out,background .15s ease-out}

.body{width:100%;min-height:50vh;font:inherit;line-height:1.6;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;resize:vertical}

.prose{max-width:68ch;min-height:50vh;padding:16px 0}
.prose h2{font-size:24px;margin:24px 0 8px}.prose h3{font-size:20px;margin:24px 0 8px}.prose h4{font-size:16px;margin:16px 0 8px}
.prose p{margin:0 0 16px}.prose ul,.prose ol{margin:0 0 16px;padding-left:24px}.prose ul{list-style:disc}

.notefoot{display:flex;justify-content:flex-end;margin-top:16px}

.stack .btn:focus-visible{outline-offset:-2px}
.lbl{display:block;font-size:14px;font-weight:500;margin:0 0 8px}
.field{width:100%;min-height:44px;font:inherit;padding:0 12px;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}

#scrim{position:fixed;inset:0;z-index:19}
#menu{position:fixed;z-index:20;min-width:208px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 4px 16px rgba(0,0,0,.14)}

#esheet{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;flex-direction:column;gap:8px;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(0,0,0,.14);transform:translateY(100%);transition:transform .25s cubic-bezier(.32,.72,0,1)}

@media(max-width:520px){
  .wrap{padding-top:8px}h1{font-size:32px}

::view-transition-old(abtl),::view-transition-new(abtl){animation-duration:.42s;animation-timing-function:cubic-bezier(.32,.72,0,1)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important;animation-duration:.01ms!important}}
</style>
</head>
<body>
<header class="appbar">
  <button class="ab-btn" id="back" hidden></button>
  <h2 class="ab-title" id="abt">Today’s Stuff</h2>
  <span class="ab-r" id="abr" hidden><button class="ab-btn" id="mode">Preview</button><button class="ab-btn" id="more" aria-label="More actions" aria-haspopup="menu"></button></span>
  <span class="ab-r" id="hbr"><button class="ab-btn" id="hmore" aria-label="More actions" aria-haspopup="menu"></button></span>
</header>
<main class="wrap">
  
  <p class="warn" id="warn" role="alert" hidden>This browser is blocking storage, so your changes won’t be saved after you close the page.</p>

  <section id="listView">
    <h1 id="date"></h1>
    <div class="tabbar">
      <div class="tabscroll" id="ts" role="tablist" aria-label="Tabs"></div>
      <button class="btn sq" id="addtab" aria-label="New tab" title="New tab"></button>
    </div>
    <div id="items"></div>
    <div id="empty" hidden></div>
    <div class="foot"><span class="cap" id="sum"></span><span class="acts"><button class="btn danger" id="deltab" hidden>Delete tab</button><button class="btn" id="clear">Clear completed</button></span></div>
  </section>

  <section id="noteView" hidden>
    <input class="ttl" id="ntitle" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" placeholder="Untitled note" aria-label="Note title">
    <div class="tools"><div class="tscroll" id="tools" role="toolbar" aria-label="Formatting">
      <button class="tb" data-fmt="bold" aria-label="Bold" title="Bold"></button>
      <button class="tb" data-fmt="italic" aria-label="Italic" title="Italic"></button>
      <button class="tb" data-fmt="h" aria-label="Heading" title="Heading"></button>
      <button class="tb" data-fmt="ul" aria-label="Bulleted list" title="Bulleted list"></button>
      <button class="tb" data-fmt="ol" aria-label="Numbered list" title="Numbered list"></button>
      <button class="tb" data-fmt="todo" aria-label="Task list" title="Task list"></button>
      <button class="tb" data-fmt="quote" aria-label="Quote" title="Quote"></button>
      <button class="tb" data-fmt="code" aria-label="Code" title="Code"></button>
      <button class="tb" data-fmt="link" aria-label="Link" title="Link"></button>
    </div></div>
    <textarea class="body" id="nbody" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" placeholder="Start writing. Select text, then use the buttons above." aria-label="Note body"></textarea>
    
    
  </section>
</main>

<button class="btn primary fab" id="new"></button>
<div id="scrim" hidden></div>
<div id="menu" role="menu" hidden></div>
<div id="esheet" hidden aria-label="Export options"></div>
<div id="pscrim" hidden></div>
<div id="pmenu" role="menu" hidden></div>

<dialog id="dlg" aria-labelledby="dt">
  <h2 id="dt">What are you adding?</h2>
  <p class="cap">Pick one to start.</p>
  <div class="stack">
  <button class="btn choice" data-t="todo"><span id="i-todo"></span><span><b>Todo</b><span class="cap">A task you can check off.</span></span></button>
  <button class="btn choice" data-t="note"><span id="i-note"></span><span><b>Note</b><span class="cap">Free-form text with Markdown.</span></span></button>
  <button class="btn" id="cancel">Cancel</button>
  </div>
</dialog>

<dialog id="tdlg" aria-labelledby="tt">
  <form id="tform" novalidate>
    <h2 id="tt">New tab</h2>
    <p class="cap" id="tsub">Group related todos and notes.</p>
    <label class="lbl" for="tname">Tab name</label>
    <input class="field" id="tname" maxlength="24" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" placeholder="Groceries" autofocus>
    <p class="err" id="terr" role="alert" hidden></p>
    <div class="stack"><button type="submit" class="btn primary" id="tok">Add tab</button><button type="button" class="btn" id="tcancel">Cancel</button></div>
  </form>
</dialog>

<dialog id="pdlg" aria-labelledby="pt">
  <div class="phead"><span></span><h2 id="pt">Preview</h2><button class="ab-btn" id="pdone">Done</button></div>
  <div class="prose pbody" id="nprev"></div>
</dialog>

<dialog id="cdlg" aria-labelledby="ct">
  <h2 id="ct"></h2>
  <p class="cap" id="cm"></p>
  <div class="stack"><button class="btn danger" id="cok"></button><button class="btn" id="ccancel">Cancel</button></div>
</dialog>

function exportData(){
  const files=[];
  const used=new Set();
  const notes=S.items.filter(i=>i.type==='note'&& (i.title||i.body));
  for(const n of notes){
    let base=slugify(n.title||n.id);
    let name='notes/'+base+'.md';
    if(used.has(name)){name='notes/'+base+'-'+n.id+'.md'}
    used.add(name);
    const content='# '+(n.title||'Untitled')+'\n\n'+(n.body||'')+'\n';
    files.push({name,data:content});
  }
  const todos=S.items.filter(i=>i.type==='todo'&&i.text.trim());
  const todoMd='# Todos\n\n'+(todos.length?todos.map(t=>`- [${t.done?'x':' '}] ${t.text}`).join('\n'):'_No todos._')+'\n';
  files.push({name:'todos.md',data:todoMd});
  if(!files.length)files.push({name:'README.md',data:"# Today's Stuff export"});
  const blob=createZip(files);
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='todays-stuff-export.zip';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function md(src){
  const e=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const inl=s=>e(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*([^*]+)\*/g,'$1<em>$2</em>').replace(/\[([^\]]+)\]\((https?:\/\/[^\s)"']+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  const out=[];let p=[],l=null,code=null,m;
  const fp=()=>{if(p.length)out.push('<p>'+p.map(inl).join('<br>')+'</p>');p=[]};
  const fl=()=>{if(l){out.push('</'+l+'>');l=null}};
  const fc=()=>{out.push('<pre><code>'+e(code.join('\n'))+'</code></pre>');code=null};
  for(const raw of src.split('\n')){
    if(code!==null){/^```/.test(raw)?fc():code.push(raw);continue}
    if(/^```/.test(raw)){fp();fl();code=[];continue}
    if(!raw.trim()){fp();fl();continue}
    if(m=raw.match(/^(#{1,3})\s+(.*)/)){fp();fl();const n=m[1].length+1;out.push(`<h${n}>${inl(m[2])}</h${n}>`);continue}
    if(/^---+\s*$/.test(raw)){fp();fl();out.push('<hr>');continue}
    if(m=raw.match(/^>\s?(.*)/)){fp();fl();out.push('<blockquote>'+inl(m[1])+'</blockquote>');continue}
    if(m=raw.match(/^([-*]|\d+\.)\s+(.*)/)){fp();const t=/\d/.test(m[1])?'ol':'ul';if(l!==t){fl();out.push('<'+t+'>');l=t}
      let b=m[2],c='';const k=b.match(/^\[( |x)\]\s+(.*)/i);if(k){c='<input type="checkbox" disabled'+(k[1]!==' '?' checked':'')+' aria-label="Task">';b=k[2]}
      out.push('<li>'+c+inl(b)+'</li>');continue}
    fl();p.push(raw);
  }
  if(code!==null)fc();
  fp();fl();return out.join('');
}

  const W={bold:['**','**','bold text'],italic:['*','*','italic text'],code:['`','`','code'],link:['[','](https://)','link text']};
  if(W[k]){const[a,b,ph]=W[k],sel=v.slice(s,e)||ph;t.setRangeText(a+sel+b,s,e,'end');
    if(k==='link'){const u=s+a.length+sel.length+2;t.setSelectionRange(u,u+8)}else t.setSelectionRange(s+a.length,s+a.length+sel.length)}
  else{
    const R={h:/^#{1,3}\s/,ul:/^[-*]\s(?!\[)/,ol:/^\d+\.\s/,todo:/^-\s\[[ x]\]\s/,quote:/^>\s?/},P={h:'# ',ul:'- ',todo:'- [ ] ',quote:'> '};
    const ls=v.lastIndexOf('\n',s-1)+1;let le=v.indexOf('\n',e);if(le<0)le=v.length;
    const lines=v.slice(ls,le).split('\n'),on=lines.every(x=>R[k].test(x));
    const out=lines.map((x,n)=>on?x.replace(R[k],''):(k==='ol'?`${n+1}. `:P[k])+x.replace(R[k],'')).join('\n');
    t.setRangeText(out,ls,le,'end');t.setSelectionRange(ls,ls+out.length);
  }
  t.focus();t.dispatchEvent(new Event('input',{bubbles:true}));
}
